name: Release

# Triggered when you push a version tag like v0.1.0. Builds Win + macOS
# installers in parallel and uploads them to the matching GitHub Release —
# electron-updater on the client side then auto-discovers updates via the
# `latest.yml` / `latest-mac.yml` manifests generated by electron-builder.

on:
  push:
    tags:
      - 'v*.*.*'

# The default GITHUB_TOKEN (since 2022) is read-only for new repos. We need
# write access to Releases for electron-builder's github publisher to upload
# the installers + manifests.
permissions:
  contents: write

jobs:
  release:
    name: Build & publish (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # mac.icon points at build/icon.icns, which isn't committed (only the
      # 1024x1024 build/icon.png is). Generate a proper multi-resolution icns
      # from it with the macOS-native iconutil so electron-builder doesn't fail.
      - name: Generate mac icon (icns) from png
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          rm -rf icon.iconset && mkdir -p icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s        build/icon.png --out "icon.iconset/icon_${s}x${s}.png"
            sips -z $((s*2)) $((s*2)) build/icon.png --out "icon.iconset/icon_${s}x${s}@2x.png"
          done
          iconutil -c icns icon.iconset -o build/icon.icns
          ls -la build/icon.icns

      - name: Build artifacts (Windows)
        if: matrix.os == 'windows-latest'
        # EP_DRAFT=false flips electron-builder's default draft-release behavior
        # so the release shows up under "Releases" right away, not in Drafts.
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Same OOM as the macOS runner — monaco + all language modes blow
          # past the default ~2GB V8 heap during Vite bundling. Earlier runs
          # passed by luck.
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Build artifacts (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run dist:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS runner's default Node heap (~2GB) OOMs while bundling the
          # monaco editor + all language modes during electron-vite build.
          # Bump it so the Vite bundle step has enough headroom.
          NODE_OPTIONS: --max-old-space-size=8192
          # CSC_LINK / CSC_KEY_PASSWORD would go here for proper code signing
          # APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD for notarization
          # Both optional — unsigned builds still install but show Gatekeeper warnings.
